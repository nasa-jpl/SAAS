# RL Training Configuration for Asteroid Visual Acquisition & Tracking
# This file configures all aspects of the training pipeline.

[simulation]
# Simulation parameters
sim_dt = 0.01  # Simulation timestep [seconds]
start_date_utc = "2024-01-01T00:00:00"
duration_seconds = 3600.0  # Total sim time per episode

[asteroid]
# Asteroid model selection
asteroid = "Itokawa"  # Name of asteroid model (must be in asteroid database)
gravity_lmax = 10  # Gravity model max degree (higher = more accurate but slower)

[flyby]
# Hyperbolic flyby parameters
periapsis_radius_m = 3000.0  # Closest approach distance [meters]
external_angle_deg = 120.0  # External angle of hyperbola [degrees]
true_anomaly0_deg = -90.0  # Initial true anomaly [degrees]
inbound_ra_deg = 0.0  # Right ascension of inbound asymptote [degrees]
inbound_dec_deg = 0.0  # Declination of inbound asymptote [degrees]
bplane_angle_deg = 0.0  # B-plane rotation angle [degrees]

[spacecraft]
# Spacecraft configuration
inertia_kgm2 = [10.0, 10.0, 10.0]  # Principal moments of inertia [kg⋅m²]
boresight_body = [1.0, 0.0, 0.0]  # Camera boresight direction in body frame

[controller]
# Attitude controller gains (used for comparison/verification)
kp = 0.5  # Proportional gain
kd = 2.0  # Derivative gain
ki = 0.01  # Integral gain
integral_limit = 0.1  # Integral wind-up limit [rad]

[reaction_wheel]
# Reaction wheel actuator parameters
max_momentum_nms = 10.0  # Max momentum per wheel [N⋅m⋅s]
max_torque_nm = 1.0  # Max torque per wheel [N⋅m]
max_speed_rps = 628.3  # Max wheel speed [rad/s] (≈ 6000 RPM)
inertia_kgm2 = 0.01  # Wheel moment of inertia [kg⋅m²]
friction_viscous = 0.001  # Viscous friction coefficient
friction_coulomb = 0.001  # Coulomb friction torque [N⋅m]
command_lag_tau = 0.01  # Motor command lag time constant [seconds]

[gyroscope]
# Gyroscope sensor parameters (tactical-grade MEMS)
bias_rad_s = [0.0, 0.0, 0.0]  # Measurement bias [rad/s]
scale_errors = [0.0, 0.0, 0.0]  # Scale factor errors (fractional)
white_noise_std_rad_s = 1e-4  # White noise std dev [rad/s]
bias_random_walk_std_rad_s2 = 1e-6  # Bias random walk std dev [rad/s²]
sample_rate_hz = 100.0  # Gyroscope sample rate [Hz]

[output]
# Simulation output
output_dir = "outputs/rl_training"
run_name = "ast_track_01"
render_video = false  # Whether to render video during training (slow!)
camera_width = 128  # Camera frame width [pixels]
camera_height = 128  # Camera frame height [pixels]
camera_fov_deg = 50.0  # Camera field of view [degrees]
render_fps = 10.0  # Video render frequency [Hz]
spp = 2  # Samples per pixel (higher = better quality but slower)

[rl_environment]
# RL environment parameters
camera_width = 128
camera_height = 128
camera_fov_deg = 50.0
max_steps = 1000  # Max steps per episode
max_steps_without_asteroid = 100  # Terminate if asteroid lost this long
asteroid_visibility_threshold = 0.01  # Min fraction of frame to be visible
torque_scale_nm = 1.0  # Max torque magnitude [N⋅m]
gyro_history_length = 4  # Number of gyro measurements to stack
render_at_frequency = null  # Render at full frequency (null = every step)

[network]
# Neural network architecture
# Vision Transformer backbone
vit_model = "vit_tiny"  # timm model name (e.g., vit_tiny, vit_small, vit_base)
vit_pretrained = true  # Use pretrained weights from ImageNet
vit_freeze_depth = 6  # Freeze first N layers (out of 12 for tiny, 0 = no freeze)

# Temporal processing for gyroscope
temporal_attention_heads = 4  # MultiheadAttention heads
temporal_attention_dim = 64  # Hidden dimension for attention

# Actor-Critic heads
hidden_dim = 256  # Hidden dimension for actor/critic MLPs
action_std_init = 0.5  # Initial action std dev (will be learned)

[training]
# Training algorithm and hyperparameters
algorithm = "PPO"
num_envs = 8  # Number of parallel environments
steps_per_rollout = 512  # Steps collected before PPO update
num_epochs = 3  # Number of PPO update epochs per rollout
batch_size = 32  # Mini-batch size for PPO updates
learning_rate = 1e-4  # Adam learning rate
entropy_coeff = 0.01  # Entropy bonus coefficient (encourages exploration)
value_coeff = 0.5  # Value loss coefficient
grad_clip_norm = 0.5  # Gradient clipping threshold
ppo_clip_ratio = 0.2  # PPO clip ratio (epsilon in the paper)
gae_lambda = 0.95  # GAE lambda (0 = low-variance, 1 = high-variance)
gamma = 0.99  # Discount factor

# Learning rate schedule (optional)
lr_schedule = "constant"  # "constant", "linear", "cosine", or "warmup_linear"
warmup_steps = 0  # For warmup schedules

# Training duration
max_steps = 1_000_000  # Maximum total environment steps
checkpoint_frequency = 10_000  # Save checkpoint every N steps
early_stopping_patience = 20  # Checkpoints without improvement before stopping
early_stopping_threshold = 0.95  # For early stopping (e.g., 95% of best return)

[logging]
# Tensorboard and console logging
tensorboard_log_dir = "outputs/rl_training/logs"
log_frequency = 100  # Log metrics every N env steps
save_video_frequency = null  # Save eval video every N checkpoints (null = never)

# Metrics to log
log_episode_return = true
log_episode_length = true
log_policy_loss = true
log_value_loss = true
log_entropy = true
log_asteroid_visibility = true
log_mean_error_angle = true
log_gradient_norm = true

[evaluation]
# Evaluation settings
num_eval_episodes = 10  # Episodes to run per evaluation
eval_frequency = 50_000  # Evaluate every N steps
deterministic = true  # No exploration noise during eval (greedy policy)
render_video = true  # Record videos of evaluation episodes
video_dir = "outputs/rl_training/eval_videos"

[device]
# Training device
device = "cuda"  # "cuda" or "cpu"
mixed_precision = false  # Use float16 for faster training (experimental)

[reproducibility]
# Reproducibility
seed = 42  # Random seed
deterministic_torch = true  # torch.use_deterministic_algorithms()
